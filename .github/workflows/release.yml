name: Build Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AUTOMATE_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::AUTOMATE_RELEASE_KEYSTORE_B64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/automate-release.jks"
          echo "AUTOMATE_STORE_FILE=$RUNNER_TEMP/automate-release.jks" >> "$GITHUB_ENV"

      - name: Export signing env
        env:
          AUTOMATE_STORE_PASSWORD: ${{ secrets.AUTOMATE_STORE_PASSWORD }}
          AUTOMATE_KEY_ALIAS: ${{ secrets.AUTOMATE_KEY_ALIAS }}
          AUTOMATE_KEY_PASSWORD: ${{ secrets.AUTOMATE_KEY_PASSWORD }}
        run: |
          if [ -z "$AUTOMATE_STORE_PASSWORD" ] || [ -z "$AUTOMATE_KEY_ALIAS" ] || [ -z "$AUTOMATE_KEY_PASSWORD" ]; then
            echo "::error::Missing signing secrets (AUTOMATE_STORE_PASSWORD / AUTOMATE_KEY_ALIAS / AUTOMATE_KEY_PASSWORD)"
            exit 1
          fi
          echo "AUTOMATE_STORE_PASSWORD=$AUTOMATE_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "AUTOMATE_KEY_ALIAS=$AUTOMATE_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "AUTOMATE_KEY_PASSWORD=$AUTOMATE_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: ./gradlew clean assembleRelease

      - name: Resolve release tag
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$TAG" = "$GITHUB_REF" ]; then
            TAG="ci-${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=AutoMate $TAG" >> "$GITHUB_OUTPUT"

      - name: Upload Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          files: app/build/outputs/apk/release/*.apk
          body: |
            AutoMate ${{ steps.tag.outputs.tag }} (release-signed, non-debuggable)

            ## Installation
            1. Download the APK below
            2. Open it on your Android phone
            3. Enable "Install from Unknown Sources" if prompted
            4. Follow the setup wizard

            ## Permissions Needed
            - Accessibility Service (for UI automation)
            - Location (for geofencing)
            - Notifications